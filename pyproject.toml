[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sb-stealth-wrapper"
version = "0.5.0"
description = "Reliability wrapper around SeleniumBase UC Mode for authorized browser testing."
readme = "README.md"
license = "MIT"
authors = [{name = "Dhiraj Das"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
keywords = ["selenium", "seleniumbase", "browser-testing", "qa", "test-automation", "reliability"]
dependencies = [
    "seleniumbase>=4.20.0",
]

[project.urls]
Homepage = "https://www.dhirajdas.dev/project/sb-stealth-wrapper"
Repository = "https://github.com/godhiraj-code/stealthautomation"
Documentation = "https://github.com/godhiraj-code/stealthautomation#readme"
"Bug Tracker" = "https://github.com/godhiraj-code/stealthautomation/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=25.0.0,<27; python_version >= '3.10'",
    "isort>=6.0.0,<9; python_version >= '3.10'",
    "mypy>=1.18.0,<2; python_version >= '3.10'",
]
benchmark = ["playwright>=1.50.0,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sb_stealth_wrapper*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312", "py313"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
