name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.9"
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.11"
          - os: ubuntu-24.04
            python-version: "3.12"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: windows-2022
            python-version: "3.11"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Install package and constrained test dependencies
        run: python -m pip install -c requirements-ci.txt ".[dev]"
      - name: Run deterministic unit tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q
      - name: Compile package and tests
        run: python -m compileall -q sb_stealth_wrapper tests
      - name: Static checks
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        run: |
          python -m black --fast --check sb_stealth_wrapper tests examples
          python -m isort --check-only sb_stealth_wrapper tests examples
          python -m mypy sb_stealth_wrapper

  package:
    name: Build and validate distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-ci.txt
      - name: Build wheel and source distribution
        run: python -m pip install -c requirements-ci.txt build twine && python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Install and import built wheel
        shell: bash
        run: |
          python -m venv /tmp/sb-stealth-wheel
          /tmp/sb-stealth-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sb-stealth-wheel/bin/python -I -c "import sb_stealth_wrapper; assert sb_stealth_wrapper.__version__ == '0.5.0'"
